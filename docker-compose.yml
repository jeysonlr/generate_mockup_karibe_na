services:
  postgres:
    image: postgres:16-alpine
    container_name: karibe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karibe123}
      POSTGRES_DB: ${POSTGRES_DB:-karibe_mockup}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-karibe} -d ${POSTGRES_DB:-karibe_mockup}']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: karibe_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@karibe.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: karibe_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-karibe}:${POSTGRES_PASSWORD:-karibe123}@postgres:5432/${POSTGRES_DB:-karibe_mockup}?schema=public
      NODE_ENV: development
    ports:
      - '3333:3333'
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      # dist usa volume nomeado para evitar conflito de permissão com o host
      - backend_dist:/app/dist
      - uploads_data:/app/uploads
      # placeholders servidos como bind mount — sempre atualizados com o repositório
      - ./backend/public:/app/public
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma generate &&
        npx prisma migrate deploy &&
        npx prisma db seed &&
        npm run build &&
        npm run start:dev
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: karibe_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      # Dentro do Docker, o browser acessa o backend via localhost:3333 (porta mapeada)
      # Para SSR/API routes no servidor Next.js, usamos o nome do serviço interno
      NEXT_PUBLIC_API_URL: http://localhost:3333
      # Necessário para hot reload funcionar no Linux com bind mount
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  uploads_data:
  backend_node_modules:
  backend_dist:
  frontend_node_modules:
  frontend_next:
